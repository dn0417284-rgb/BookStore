<!-- login/login.component.html -->
<div class="auth-container">
  <div class="auth-card">
    <h2 class="auth-title">Đăng Nhập</h2>
    <p class="auth-subtitle">Chào mừng trở lại!</p>

    <!-- Thông báo lỗi từ server -->
    <div class="error-alert" *ngIf="errorMessage">
      <span>⚠️ {{ errorMessage }}</span>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>

      <!-- Email -->
      <div class="form-group">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="example@email.com"
          [class.is-invalid]="email.invalid && email.touched"
          autocomplete="email"
        />
        <div class="field-error" *ngIf="email.touched && email.hasError('required')">
          Vui lòng nhập email.
        </div>
        <div class="field-error" *ngIf="email.touched && email.hasError('email')">
          Email không hợp lệ.
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Mật khẩu</label>
        <div class="input-wrapper">
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="Nhập mật khẩu"
            [class.is-invalid]="password.invalid && password.touched"
            autocomplete="current-password"
          />
          <button type="button" class="toggle-pw" (click)="showPassword = !showPassword">
            <i class="fa" [class.fa-eye]="!showPassword" [class.fa-eye-slash]="showPassword"></i>
          </button>
        </div>
        <div class="field-error" *ngIf="password.touched && password.hasError('required')">
          Vui lòng nhập mật khẩu.
        </div>
        <div class="field-error" *ngIf="password.touched && password.hasError('minlength')">
          Mật khẩu phải có ít nhất 6 ký tự.
        </div>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn-primary" [disabled]="isLoading">
        <span *ngIf="!isLoading">Đăng Nhập</span>
        <span *ngIf="isLoading">Đang xử lý...</span>
      </button>

    </form>

    <p class="auth-link">
      Chưa có tài khoản?
      <a routerLink="/register">Đăng ký ngay</a>
    </p>
  </div>
</div>
