<form *ngIf="productForm" [formGroup]="productForm" (ngSubmit)="onSubmit()" class="product-form">
  <h2>Thêm sách mới</h2>

  <!-- Tiêu đề -->
  <div class="form-group">
    <label>Tiêu đề</label>

    <div class="input-container">
      <input type="text" placeholder="Tiêu đề sách" formControlName="title" />

      <small
        class="error-message"
        *ngIf="title?.errors?.['required'] && (title?.dirty || title?.touched)"
      >
        Tiêu đề không được để trống
      </small>
    </div>
  </div>

  <!-- Số lượng -->
  <div class="form-group">
    <label>Số lượng</label>

    <div class="input-container">
      <input type="number" placeholder="Số lượng" formControlName="sold" />

      <small
        class="error-message"
        *ngIf="sold?.errors?.['required'] && (sold?.dirty || sold?.touched)"
      >
        Số lượng bắt buộc
      </small>

      <small class="error-message" *ngIf="sold?.errors?.['min'] && (sold?.dirty || sold?.touched)">
        Giá trị chưa đúng
      </small>
    </div>
  </div>

  <!-- Giá bán -->
  <div class="form-group">
    <label>Giá bán</label>

    <div class="input-container">
      <input type="number" placeholder="Giá bán" formControlName="price" />

      <small
        class="error-message"
        *ngIf="price?.errors?.['required'] && (price?.dirty || price?.touched)"
      >
        Giá bán bắt buộc
      </small>

      <small
        class="error-message"
        *ngIf="price?.errors?.['min'] && (price?.dirty || price?.touched)"
      >
        Giá trị chưa đúng
      </small>
    </div>
  </div>

  <!-- Nhà xuất bản -->
  <div class="form-group">
    <label>Nhà xuất bản</label>

    <div class="input-container">
      <input type="text" placeholder="Nhà xuất bản" formControlName="publisher" />

      <small
        class="error-message"
        *ngIf="publisher?.errors?.['required'] && (publisher?.dirty || publisher?.touched)"
      >
        Nhà xuất bản bắt buộc
      </small>
    </div>
  </div>

  <!-- Tác giả -->
  <div class="form-group">
    <label>Tác giả</label>

    <div class="input-container">
      <input type="text" placeholder="Tác giả" formControlName="author" />

      <small
        class="error-message"
        *ngIf="author?.errors?.['required'] && (author?.dirty || author?.touched)"
      >
        Tác giả bắt buộc
      </small>
    </div>
  </div>

  <!-- Loại bìa -->
  <div class="form-group">
    <label>Loại bìa</label>

    <div class="input-container">
      <input type="text" placeholder="Loại bìa" formControlName="cover_type" />

      <small
        class="error-message"
        *ngIf="cover_type?.errors?.['required'] && (cover_type?.dirty || cover_type?.touched)"
      >
        Loại bìa bắt buộc
      </small>
    </div>
  </div>

  <!-- Mô tả -->
  <div class="form-group full-width">
    <label>Mô tả</label>

    <div class="input-container">
      <textarea placeholder="Mô tả sách" formControlName="description"></textarea>
    </div>
  </div>

  <!-- Hình ảnh -->
  <div class="form-group full-width">
    <label>Hình ảnh</label>

    <div class="input-container">
      <input type="file" accept="image/*" (change)="onFileSelected($event)" />

      <small
        class="error-message"
        *ngIf="image?.errors?.['required'] && (image?.dirty || image?.touched)"
      >
        Hình ảnh bắt buộc
      </small>
    </div>
  </div>

  <!-- Button -->
  <div class="form-actions">
    <button type="submit" [disabled]="productForm.invalid">Thêm sách</button>

    <button type="button" class="btn-cancel" (click)="onCancel()">Hủy</button>
  </div>
</form>
