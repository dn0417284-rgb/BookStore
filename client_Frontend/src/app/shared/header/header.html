<header class="header">

  <div class="header-container">

    <a
      routerLink="/"
      class="logo"
    >
      <img
          [src]="'http://localhost:3000/uploads/logo.jpg' "
          alt="Bookstore Logo" 
        class="logo-img"
         />
     
      
      <span class="logo-text">BOOKSTORE</span>
    </a>


    <nav class="nav">

      <a routerLink="/">
        Trang chủ
      </a>

      <a>
        Danh mục
      </a>

      <a>
        Sách mới
      </a>

      <a>
        Khuyến mãi
      </a>

    </nav>

    <div class="search-box">

  <input
    type="text"
    placeholder="Tìm kiếm sách..."
    [(ngModel)]="searchKeyword"
    (input)="search()"
    (keyup.enter)="search()"
  >

  <button (click)="search()">
    <svg 
      xmlns="http://w3.org" 
      viewBox="0 0 24 24" 
      class="search-icon"
    >
      <circle cx="11" cy="11" r="7" />
      <line x1="16" y1="16" x2="22" y2="22" />
    </svg>
  </button>

</div>


    <div class="actions">

      <a
        routerLink="/cart"
        class="cart-btn"
      >
        <svg 
          xmlns="http://w3.org" 
          viewBox="0 0 100 100" 
          class="cart-icon"
        >
          <path d="M5 5 h15 l10 50 h60 l8 -38 h-68" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          
          <line x1="26" y1="30" x2="84" y2="30" stroke="currentColor" stroke-width="3"/>
          <line x1="28" y1="43" x2="81" y2="43" stroke="currentColor" stroke-width="3"/>
          
          <line x1="45" y1="17" x2="45" y2="55" stroke="currentColor" stroke-width="3"/>
          <line x1="65" y1="17" x2="65" y2="55" stroke="currentColor" stroke-width="3"/>

          <circle cx="35" cy="72" r="7" fill="currentColor"/>
          <circle cx="75" cy="72" r="7" fill="currentColor"/>
        </svg>

        <span
          *ngIf="cartCount > 0"
          class="badge"
        >
          {{ cartCount }}
        </span>
      </a>


      <div class="actions">

  <!-- Chưa đăng nhập -->

    <ng-container *ngIf="!customer">

      <a
        routerLink="/login"
        class="login-btn"
      >
        Đăng nhập
      </a>

      <a
        routerLink="/register"
        class="register-btn"
      >
        Đăng ký
      </a>

    </ng-container>

    <!-- Đã đăng nhập -->

    <ng-container *ngIf="customer">

  <div class="user-menu">

    <button
      class="user-btn"
      (click)="toggleUserMenu()"
    >

      {{ customer.full_name }}

      ▼

    </button>

    <div
  class="dropdown-menu"
  *ngIf="showUserMenu"
>

  <!-- USER -->

  <ng-container *ngIf="!isAdmin">

    <a
      routerLink="/profile"
      (click)="showUserMenu = false"
    >
      Thông tin cá nhân
    </a>

    <a
      routerLink="/orders"
      (click)="showUserMenu = false"
    >
      Đơn hàng của tôi
    </a>

  </ng-container>

  <!-- ADMIN -->

  <ng-container *ngIf="isAdmin">

    <a
      routerLink="/admin/customers"
      (click)="showUserMenu = false"
    >
      Quản lý người dùng
    </a>

    <a
      routerLink="/admin/products"
      (click)="showUserMenu = false"
    >
      Quản lý sản phẩm
    </a>

    <a
      routerLink="/admin/orders"
      (click)="showUserMenu = false"
    >
      Quản lý đơn hàng
    </a>

  </ng-container>

  <button
    (click)="logout()"
  >
    Đăng xuất
  </button>

</div>

  </div>

</ng-container>

  </div>

    </div>

  </div>

</header>
